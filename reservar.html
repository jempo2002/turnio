<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reservar — Barbería El Cuartel</title>
<meta name="description" content="Reserva tu cita en Barbería El Cuartel: elige servicio, hora y profesional.">
<meta name="theme-color" content="#FFFFFF">
<script src="https://cdn.tailwindcss.com"></script>
<script src="theme.js"></script>
<script src="datos.js"></script>
</head>

<body class="min-h-screen bg-slate-100 font-sans text-brand-darkest antialiased">

<div class="mx-auto max-w-md">

  <header class="bg-white px-5 pb-4 pt-5">
    <div class="flex items-center gap-3">
      <span class="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-brand-dark text-lg font-bold text-white" aria-hidden="true">EC</span>
      <div class="min-w-0 flex-1">
        <h1 class="truncate text-xl font-semibold tracking-tight">Barbería El Cuartel</h1>
        <p class="truncate text-xs text-brand-darkest/55">Cra. 45 #12-30 · Abierto hasta las 20:00</p>
      </div>
    </div>
    <p class="mt-3 inline-flex items-center gap-1.5 rounded-full bg-emerald-50 px-2.5 py-1 text-xs font-semibold text-emerald-700">
      <span class="h-1.5 w-1.5 rounded-full bg-emerald-500" aria-hidden="true"></span>
      Disponibilidad en vivo
    </p>
  </header>

  <main class="px-5 pb-[calc(2.5rem+env(safe-area-inset-bottom))] pt-5">

    <form id="form-reserva" class="space-y-6">

      <fieldset>
        <legend class="text-sm font-semibold">1. Servicio</legend>
        <div id="servicios" class="mt-2.5 space-y-2"></div>
      </fieldset>

      <fieldset>
        <legend class="text-sm font-semibold">2. Hora</legend>
        <div id="horas" class="mt-2.5 grid grid-cols-4 gap-2"></div>
      </fieldset>

      <fieldset>
        <legend class="text-sm font-semibold">3. Profesional</legend>
        <p id="pros-ayuda" class="mt-1 text-xs text-brand-darkest/55" aria-live="polite"></p>
        <div id="pros" class="mt-2.5 space-y-2"></div>
      </fieldset>

      <fieldset class="space-y-3">
        <legend class="text-sm font-semibold">4. Tus datos</legend>
        <div>
          <label for="nombre" class="sr-only">Nombre</label>
          <input id="nombre" name="nombre" type="text" required maxlength="60" autocomplete="name" placeholder="Nombre"
                 class="block w-full rounded-xl border border-brand-light bg-white px-4 py-3.5 text-base placeholder:text-brand-darkest/35 transition focus:border-brand focus:outline-none focus:ring-4 focus:ring-brand/25">
        </div>
        <div>
          <label for="telefono" class="sr-only">WhatsApp</label>
          <input id="telefono" name="telefono" type="tel" inputmode="tel" autocomplete="tel" required
                 pattern="[0-9+ \(\)\-]{7,20}" maxlength="20" placeholder="WhatsApp (ej. 300 111 2233)"
                 class="block w-full rounded-xl border border-brand-light bg-white px-4 py-3.5 text-base placeholder:text-brand-darkest/35 transition focus:border-brand focus:outline-none focus:ring-4 focus:ring-brand/25">
          <p class="mt-1.5 text-xs text-brand-darkest/50">Te llega el recordatorio por aquí. No se comparte con nadie.</p>
        </div>
      </fieldset>

      <button type="submit"
              class="w-full rounded-2xl bg-brand-dark py-4 text-base font-semibold text-white transition hover:bg-brand-darkest active:scale-[.98]">
        Confirmar reserva
      </button>
    </form>

    <div id="reserva-ok" class="hidden rounded-3xl border border-slate-200 bg-white p-6 text-center shadow-soft">
      <span class="mx-auto grid h-12 w-12 place-items-center rounded-full bg-emerald-50 text-emerald-600">
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6.5L9.5 17 4 11.5"></path></svg>
      </span>
      <p class="mt-3 text-base font-semibold">¡Cita reservada!</p>
      <p id="reserva-detalle" class="mt-1 text-sm text-brand-darkest/60"></p>
      <button type="button" id="btn-otra" class="mt-2 text-sm font-semibold text-brand-dark underline underline-offset-4">Reservar otra cita</button>
    </div>

    <p class="mt-6 text-center text-xs text-brand-darkest/45">Reservas con Turnio</p>
  </main>
</div>

<script>
(function () {
  'use strict';

  /* Esta página solo pinta lo que entrega disponibilidad(): nombre y libre/ocupado.
     ponytail: en la demo los datos del local viven en localStorage de este mismo navegador.
     Con backend, esta página solo consume /api/public/:slug (servicios, disponibilidad, reservar)
     y nunca recibe correos, pagos ni caja. */
  var citas = window.datos.citas;
  var servicios = window.datos.servicios;
  var barberos = window.datos.barberos;

  var $ = function (id) { return document.getElementById(id); };
  var form = $('form-reserva');
  var ok = $('reserva-ok');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function elegido(nombre) {
    var r = form.querySelector('input[name="' + nombre + '"]:checked');
    return r ? r.value : '';
  }

  function pintarServicios() {
    var antes = elegido('servicio');
    $('servicios').innerHTML = servicios.map(function (s, i) {
      return '<label class="flex min-h-[56px] cursor-pointer items-center gap-3 rounded-2xl border border-brand-light bg-white p-3 transition has-[:checked]:border-brand-dark has-[:checked]:bg-brand-lightest/50">' +
        '<input type="radio" name="servicio" value="' + i + '" required' + (String(i) === antes ? ' checked' : '') + ' class="h-5 w-5 shrink-0 accent-brand-dark">' +
        '<span class="min-w-0 flex-1 truncate text-sm font-medium">' + esc(s.nombre) +
          '<span class="block text-xs font-normal text-brand-darkest/55">' + esc(s.duracion) + ' min</span></span>' +
        '<span class="shrink-0 text-sm font-semibold">' + window.pesos(s.precio) + '</span>' +
      '</label>';
    }).join('') || '<p class="text-sm text-brand-darkest/55">Este negocio aún no publica servicios.</p>';
  }

  /* Una hora se puede pedir mientras quede al menos un profesional libre */
  function pintarHoras() {
    var antes = elegido('hora');
    $('horas').innerHTML = window.horasAgenda(citas).map(function (hora) {
      var libres = window.disponibilidad(citas, barberos, hora).filter(function (b) { return b.disponible; }).length;
      return '<label class="flex min-h-[52px] min-w-0 cursor-pointer flex-col items-center justify-center rounded-xl border border-brand-light bg-white px-1 text-sm font-semibold tabular-nums transition ' +
        'has-[:checked]:border-brand-dark has-[:checked]:bg-brand-lightest has-[:checked]:text-brand-dark has-[:focus-visible]:ring-2 has-[:focus-visible]:ring-brand ' +
        'has-[:disabled]:cursor-not-allowed has-[:disabled]:bg-slate-200/60 has-[:disabled]:text-brand-darkest/40">' +
        '<input type="radio" name="hora" value="' + esc(hora) + '" required class="sr-only"' +
          (libres ? '' : ' disabled') + (libres && hora === antes ? ' checked' : '') + '>' +
        esc(hora) +
        '<span class="text-[10px] font-medium ' + (libres ? 'text-emerald-700' : '') + '">' + (libres ? libres + (libres === 1 ? ' libre' : ' libres') : 'Lleno') + '</span>' +
      '</label>';
    }).join('');
  }

  function pintarPros() {
    var hora = elegido('hora'), antes = elegido('barbero');
    if (!hora) {
      $('pros').innerHTML = '';
      $('pros-ayuda').textContent = 'Elige una hora para ver quién está libre.';
      return;
    }
    $('pros-ayuda').textContent = 'A las ' + hora + ':';
    $('pros').innerHTML = window.disponibilidad(citas, barberos, hora).map(function (b) {
      return '<label class="flex min-h-[60px] items-center gap-3 rounded-2xl border p-3 transition ' +
        (b.disponible
          ? 'cursor-pointer border-brand-light bg-white has-[:checked]:border-brand-dark has-[:checked]:bg-brand-lightest/50'
          : 'cursor-not-allowed border-slate-200 bg-slate-200/50') + '">' +
        '<input type="radio" name="barbero" value="' + esc(b.nombre) + '" required class="h-5 w-5 shrink-0 accent-brand-dark"' +
          (b.disponible ? '' : ' disabled') + (b.disponible && b.nombre === antes ? ' checked' : '') + '>' +
        '<span class="grid h-10 w-10 shrink-0 place-items-center rounded-full text-xs font-bold text-white ' + (b.disponible ? 'bg-brand-dark' : 'bg-slate-400') + '" aria-hidden="true">' + esc(b.nombre.slice(0, 2).toUpperCase()) + '</span>' +
        '<span class="min-w-0 flex-1 truncate text-sm font-semibold' + (b.disponible ? '' : ' text-brand-darkest/50') + '">' + esc(b.nombre) + '</span>' +
        '<span class="shrink-0 rounded-full px-2.5 py-1 text-[11px] font-bold uppercase tracking-wide ' +
          (b.disponible ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-200 text-brand-darkest/55') + '">' + (b.disponible ? 'Disponible' : 'Ocupado') + '</span>' +
      '</label>';
    }).join('');
    return antes && !elegido('barbero') ? antes : '';   /* el que estaba elegido y se acaba de ocupar */
  }

  function pintar() {
    pintarHoras();
    return pintarPros();
  }

  form.addEventListener('change', function (e) {
    if (e.target.name === 'hora') pintarPros();
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var d = new FormData(form);
    var s = servicios[Number(d.get('servicio'))];
    var cliente = String(d.get('nombre')).trim();
    if (!s || !cliente) { window.toast('Revisa el servicio y tu nombre', 'error'); return; }

    /* reservar() vuelve a comprobar la franja: otro cliente pudo ganarla hace un segundo */
    var cita = window.reservar(citas, String(d.get('hora')), String(d.get('barbero')), {
      cliente: cliente,
      tel: String(d.get('telefono')).replace(/[^0-9]/g, ''),
      servicio: s.nombre,
      precio: s.precio
    });
    if (!cita) { window.toast('Ese profesional se acaba de ocupar. Elige otro.', 'error'); pintar(); return; }

    window.guardar();
    $('reserva-detalle').textContent = cita.servicio + ' · hoy a las ' + cita.hora + ' con ' + cita.barbero + ' · ' + window.pesos(cita.precio);
    form.classList.add('hidden');
    ok.classList.remove('hidden');
  });

  $('btn-otra').addEventListener('click', function () {
    form.reset();
    form.classList.remove('hidden', 'enviado');
    ok.classList.add('hidden');
    pintar();
  });

  /* Tiempo real: el panel completó, liberó o agendó una cita en otra pestaña */
  document.addEventListener('turnio:datos', function () {
    pintarServicios();
    var perdido = pintar();
    if (perdido) window.toast(perdido + ' se acaba de ocupar a esa hora', 'error');
  });

  pintarServicios();
  pintar();
})();
</script>

</body>
</html>
