<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{% block title %}{% endblock %}</title>
<meta name="theme-color" content="#FFFFFF">
{% block meta %}<meta name="robots" content="noindex">{% endblock %}
<meta name="csrf-token" content="{{ csrf_token() }}">
<link rel="icon" href="{{ url_for('static', filename='img/icono.svg') }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ url_for('static', filename='css/panel.css') }}">
{% block scripts %}{% endblock %}
</head>
<body class="min-h-screen bg-slate-100 font-sans text-brand-darkest antialiased"{% block body_attrs %}{% endblock %}>
{% block content %}{% endblock %}
</body>
</html>
