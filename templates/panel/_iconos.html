{#- Iconos SVG del panel como macros: asi no hace falta marcar HTML como seguro (tests/test_seguridad.py). -#}
{% macro cerrar() -%}
<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
{%- endmacro %}

{% macro flecha() -%}
<svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
{%- endmacro %}

{% macro pestana(nombre) -%}
<svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

<rect x="3" y="4.5" width="18" height="16" rx="3"></rect><path d="M8 2.5v4M16 2.5v4M3 10h18"></path><circle cx="12" cy="15" r="1.6" fill="currentColor" stroke="none"></circle>
{%- elif nombre == 'caja' -%}
<rect x="2.5" y="6" width="19" height="13" rx="3"></rect><path d="M2.5 10.5h19M6.5 15h3"></path>
{%- elif nombre == 'inventario' -%}
<path d="M21 8.5v7a2 2 0 0 1-1 1.7l-7 4a2 2 0 0 1-2 0l-7-4a2 2 0 0 1-1-1.7v-7a2 2 0 0 1 1-1.7l7-4a2 2 0 0 1 2 0l7 4A2 2 0 0 1 21 8.5Z"></path><path d="M3.5 7.5L12 12.5l8.5-5M12 21.5v-9"></path>

{%- endif -%}
</svg>
{%- endmacro %}
