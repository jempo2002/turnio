# T10: pruebas en cada PR hacia `test` y `main` (y en cada push a esas ramas).
# Base real como en Railway: MariaDB + Redis. Si la base no responde, las
# pruebas fallan en vez de saltarse (TEST_DB_OBLIGATORIA).
name: CI

on:
  pull_request:
    branches: [test, main]
  push:
    branches: [test, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas del backend (pytest, ${{ matrix.base.nombre }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # MariaDB en local; MySQL 8 es el de Railway (T11): las migraciones
        # tienen que correr, y repetirse, en los dos.
        base:
          - nombre: MariaDB 10.11
            imagen: public.ecr.aws/docker/library/mariadb:10.11
            salud: healthcheck.sh --connect --innodb_initialized
          - nombre: MySQL 8.0
            imagen: public.ecr.aws/docker/library/mysql:8.0
            salud: mysqladmin ping -h 127.0.0.1 -proot
    services:
      mariadb:
        image: ${{ matrix.base.imagen }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="${{ matrix.base.salud }}"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: public.ecr.aws/docker/library/redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "3306"
      TEST_DB_USER: root
      TEST_DB_PASSWORD: root
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      TEST_DB_OBLIGATORIA: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -ra

  calculo:
    name: Cálculos del frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node test-calculo.js

  dependencias:
    name: Vulnerabilidades en dependencias (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
