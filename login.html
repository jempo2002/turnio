<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Iniciar sesión — Turnia</title>
<meta name="description" content="Accede a tu agenda y a la caja de tu barbería con Turnia.">
<meta name="theme-color" content="#C7EBF6">
<meta name="robots" content="noindex">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: {
            lightest: '#C7EBF6',
            light:    '#9BD1DB',
            DEFAULT:  '#54C2DD',
            dark:     '#238AA6',
            darkest:  '#244D6A'
          }
        },
        fontFamily: {
          sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Inter', 'Helvetica Neue', 'Arial', 'sans-serif']
        },
        boxShadow: {
          card: '0 1px 2px rgba(36,77,106,.04), 0 24px 48px -20px rgba(36,77,106,.30)'
        }
      }
    }
  };
</script>
<style type="text/tailwindcss">
  @layer base {
    :focus-visible { outline: 2px solid #238AA6; outline-offset: 3px; border-radius: 6px; }
    /* El navegador solo marca en rojo tras el primer intento de envío, no mientras se escribe */
    form.enviado input:invalid { border-color: #dc2626; }
  }
</style>
</head>

<body class="flex min-h-screen min-h-[100dvh] bg-brand-lightest font-sans text-brand-darkest antialiased selection:bg-brand-light/60">

  <!-- m-auto (no justify-center): centra vertical sin recortar el borde superior
       cuando el teclado del móvil reduce la altura visible -->
  <main class="m-auto w-full max-w-sm px-5 py-10">

    <a href="index.html"
       class="mx-auto mb-8 flex w-fit items-center gap-2.5 rounded-xl transition hover:opacity-70"
       aria-label="Turnia, volver al inicio">
      <span class="grid h-10 w-10 place-items-center rounded-xl bg-brand-dark text-white">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4.5" width="18" height="16" rx="3"></rect>
          <path d="M8 2.5v4M16 2.5v4M3 10h18"></path>
          <path d="M9.5 14.5l2 2 3.5-4"></path>
        </svg>
      </span>
      <span class="text-lg font-semibold tracking-tight">Turnia</span>
    </a>

    <!-- ═══ CARD ═══ -->
    <div class="rounded-3xl border border-white/70 bg-white/90 p-7 shadow-card backdrop-blur-xl sm:p-9">

      <h1 class="text-2xl font-semibold tracking-tight sm:text-3xl">Bienvenido de vuelta</h1>
      <p class="mt-2 text-sm leading-relaxed text-brand-darkest/60">
        Ingresa para ver tu agenda del día y cerrar la caja.
      </p>

      <form action="#" method="post" class="mt-8 space-y-5" onsubmit="this.classList.add('enviado')">

        <!-- Correo -->
        <div>
          <label for="email" class="block text-sm font-medium">Correo electrónico</label>
          <input
            id="email"
            name="email"
            type="email"
            required
            autocomplete="email"
            inputmode="email"
            spellcheck="false"
            autocapitalize="none"
            maxlength="254"
            placeholder="tu@barberia.com"
            class="mt-2 block w-full rounded-xl border border-brand-light bg-slate-50 px-4 py-3.5 text-base text-brand-darkest placeholder:text-brand-darkest/35 transition
                   focus:border-brand focus:bg-white focus:outline-none focus:ring-4 focus:ring-brand/25">
        </div>

        <!-- Contraseña -->
        <div>
          <label for="password" class="block text-sm font-medium">Contraseña</label>
          <input
            id="password"
            name="password"
            type="password"
            required
            autocomplete="current-password"
            minlength="8"
            maxlength="128"
            placeholder="••••••••"
            class="mt-2 block w-full rounded-xl border border-brand-light bg-slate-50 px-4 py-3.5 text-base text-brand-darkest placeholder:text-brand-darkest/35 transition
                   focus:border-brand focus:bg-white focus:outline-none focus:ring-4 focus:ring-brand/25">

          <div class="mt-2.5 flex justify-end">
            <a href="mailto:hola@turnia.app?subject=Recuperar%20mi%20contrase%C3%B1a" class="rounded text-xs font-medium text-brand-darkest/70 underline-offset-4 transition hover:text-brand-dark hover:underline">
              ¿Olvidaste tu contraseña?
            </a>
          </div>
        </div>

        <!-- CTA -->
        <button type="submit"
                class="w-full rounded-xl bg-brand-dark px-6 py-4 text-base font-semibold text-white shadow-lg shadow-brand-dark/25 transition
                       hover:bg-brand-darkest hover:shadow-brand-darkest/25 active:scale-[.98] active:shadow-sm">
          Iniciar sesión
        </button>
      </form>

      <p class="mt-7 border-t border-brand-light/50 pt-6 text-center text-sm text-brand-darkest/60">
        ¿Aún no usas Turnia?
        <a href="index.html#demo" class="rounded font-semibold text-brand-darkest underline-offset-4 transition hover:text-brand-dark hover:underline">
          Agenda un demo
        </a>
      </p>
    </div>

    <p class="mt-5 text-center text-xs text-brand-darkest/50">
      <a href="app.html" class="rounded font-medium underline underline-offset-4 transition hover:text-brand-dark">Ver el panel de demo</a>
    </p>

    <p class="mt-6 text-center text-xs text-brand-darkest/45">
      © 2026 Turnia · <a href="#" class="underline-offset-2 transition hover:text-brand-dark hover:underline">Términos y privacidad</a>
    </p>

  </main>

</body>
</html>
